name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt -r test/synthesis-requirements.txt

      - name: Run tests
        run: |
          make test
          make mutations
          make synth-check
          make formal
          make synth-top-check
          make host-mutations

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/engine/results.xml
            work/synthesis/results.xml
            work/synthesis-top/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
            test/engine/results.xml
            work/rtl-witness.json
            work/mutations/summary.json
            work/mutations/*/simulation.log
            work/synthesis/summary.json
            work/synthesis/results.xml
            work/synthesis/yosys.log
            work/formal/summary.json
            work/formal/yosys.log
            work/formal/*.vcd
            work/synthesis-top/summary.json
            work/synthesis-top/results.xml
            work/synthesis-top/yosys.log
            work/pin-host-witness.json
            work/host-mutations/summary.json
            work/host-mutations/*/simulation.log
            work/i2c-witness.json
            work/i2c-witness-smoke.json
            work/spi-witness.json
            work/spi-capture.json
