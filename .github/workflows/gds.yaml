name: CMOS5L integrated 6x4 build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned upstream action for installer compatibility repair
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: 45187a61556e197732a236b3f56acd2c800b9e0e
          path: .preview-action
      - name: Repair duplicate process-directory checkout
        run: python3 scripts/prepare-preview-action.py
      - name: Build current CMOS5L 6x4 GDS
        uses: ./.preview-action
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: da63c9927411e3aca350977d653d24bbf5bca972

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned upstream action for installer compatibility repair
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: 45187a61556e197732a236b3f56acd2c800b9e0e
          path: .preview-action
      - name: Repair duplicate process-directory checkout
        run: python3 scripts/prepare-preview-action.py
      - uses: ./.preview-action/precheck
        with:
          tools-ref: da63c9927411e3aca350977d653d24bbf5bca972

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned upstream action for installer compatibility repair
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: 45187a61556e197732a236b3f56acd2c800b9e0e
          path: .preview-action
      - name: Repair duplicate process-directory checkout
        run: python3 scripts/prepare-preview-action.py
      - uses: ./.preview-action/gl_test

  electrical_checks:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: physical-artifacts/GDS_logs
      - name: Require clean final timing, electrical and geometry metrics
        run: python3 scripts/summarize-physical.py physical-artifacts physical-summary.json --require-clean
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: physical_summary
          path: physical-summary.json
